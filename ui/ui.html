<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css"/>
</head>
<body>
    
    <div class="keypad">
        <img src="prop_ld_keypad.png">
        <div class="content">
            <div class="display">
            </div>
            <div class="input">
                <div class="row">
                    <div id='btn1' class="btn">
                        <div class="sublabel"></div>
                        <div class="label">1</div>
                    </div>
                    <div id='btn2' class="btn">
                        <div class="sublabel">ABC</div>
                        <div class="label">2</div>
                    </div>
                    <div id='btn3' class="btn">
                        <div class="sublabel">DEF</div>
                        <div class="label">3</div>
                    </div>
                    <div id='btn13' class="btn color-key red-key"></div>
                </div>
                <div class="row">
                    <div id='btn4' class="btn">
                        <div class="sublabel">GHI</div>
                        <div class="label">4</div>
                    </div>
                    <div id='btn5' class="btn">
                        <div class="sublabel">JKL</div>
                        <div class="label">5</div>
                    </div>
                    <div id='btn6' class="btn">
                        <div class="sublabel">MNO</div>
                        <div class="label">6</div>
                    </div>
                    <div id='btn14' class="btn color-key green-key"></div>
                </div>
                <div class="row">
                    <div id='btn7' class="btn">
                        <div class="sublabel">PQRS</div>
                        <div class="label">7</div>
                    </div>
                    <div id='btn8' class="btn">
                        <div class="sublabel">TUV</div>
                        <div class="label">8</div>
                    </div>
                    <div id='btn9' class="btn">
                        <div class="sublabel">WXYZ</div>
                        <div class="label">9</div>
                    </div>
                    <div id='btn15' class="btn color-key blue-key"></div>
                </div>
                <div class="row">
                    <div id='btn10' class="btn">
                        <div class="sublabel"></div>
                        <div class="label">S</div>
                    </div>
                    <div id='btn11' class="btn">
                        <div class="sublabel"></div>
                        <div class="label">0</div>
                    </div>
                    <div id='btn12' class="btn">
                        <div class="sublabel"></div>
                        <div class="label">#</div>
                    </div>
                    <div id='btn16' class="btn color-key yellow-key"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="mouse">
        <span class="fa-xmark" aria-hidden="true">×</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
